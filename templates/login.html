{% extends "base.html" %}

{% block title %}Login - CubePermutation AI{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="glass-card w-full max-w-md p-8 rounded-2xl border border-slate-800/80 bg-slate-950/70 backdrop-blur-2xl shadow-2xl relative overflow-hidden group">
        
        <!-- Glowing accent orb in background -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none group-hover:bg-indigo-600/40 transition-all duration-700"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none group-hover:bg-cyan-600/30 transition-all duration-700"></div>

        <!-- Header -->
        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 p-0.5 shadow-xl shadow-indigo-500/20 mb-4">
                <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                    <i class="fa-solid fa-lock text-indigo-400 text-xl"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold font-outfit text-white tracking-tight">Welcome Back</h1>
            <p class="text-xs text-slate-400 mt-1 font-mono">Sign in to access permutation orbits & solver</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" class="space-y-5 relative z-10">
            <div>
                <label for="username" class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider font-mono">
                    <i class="fa-solid fa-user text-indigo-400 mr-1.5"></i> Username
                </label>
                <div class="relative">
                    <input type="text" id="username" name="username" required autocomplete="username"
                           placeholder="Enter your username"
                           class="w-full px-4 py-3 bg-slate-900/80 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm font-sans">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider font-mono">
                    <i class="fa-solid fa-key text-indigo-400 mr-1.5"></i> Password
                </label>
                <div class="relative">
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           placeholder="Enter your secure password"
                           class="w-full px-4 py-3 bg-slate-900/80 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm font-sans">
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-medium text-sm rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all duration-300 flex items-center justify-center gap-2 group/btn">
                <span>Authenticate & Access</span>
                <i class="fa-solid fa-arrow-right group-hover/btn:translate-x-1 transition-transform"></i>
            </button>
        </form>

        <!-- Footer link -->
        <div class="mt-8 pt-6 border-t border-slate-800/80 text-center relative z-10">
            <p class="text-xs text-slate-400">
                Don't have an account? 
                <a href="{{ url_for('register') }}" class="text-cyan-400 hover:text-cyan-300 font-medium ml-1 hover:underline">
                    Create Account
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
